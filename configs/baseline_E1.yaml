# Paper baseline: KDE density + fixed penalty p. Reproduces Table 1.
method: baseline
env:
  id: E1
  offline_dataset: data/E1_offline.parquet
transition_model:
  type: lstm
  frozen_checkpoint: null      # null -> physics fallback (runs before LSTM is trained)
  obs_dim: 3
  act_dim: 1
cost_signal:
  type: kde_density
  bandwidth: 0.1               # paper value
  ref_percentile: 5.0
weight:
  type: fixed
  p: 10.0                      # sweep {2, 10, 30}
agent:
  algo: sac
  total_steps: 150000
eval:
  episodes: 2000
  max_steps: 200
  reward: clean
compute:
  local_mem_budget_mb: 18000   # set to YOUR machine
