# Maram/Theresa 3: learned Lagrange multiplier α. Decisive env = E3 (unknown/shifting p).
method: lagr
env:
  id: E1                       # also run on E3
  offline_dataset: data/E1_offline.parquet
  excluded_zone: [1.2566370614359172, 1.8849555921538759]   # [2pi/5, 3pi/5], paper zone
  zone_symmetric: false        # one side only -> the agent can swing up around the OTHER
                               # side. Mirroring it (true) blocks both routes, which makes
                               # zone avoidance and swing-up mutually exclusive.
  start_state: {theta: 3.141592653589793, theta_dot: 0.0, noise: 0.05}   # spec §3: resting
                               # position. Gym's default reset is uniform over the whole
                               # circle, which makes zone_visit_rate a statement about the
                               # start state instead of about the agent's route choice.
transition_model:
  type: lstm
  frozen_checkpoint: null
  obs_dim: 3
  act_dim: 1
cost_signal:
  type: kde_density            # same cost signal as baseline -> isolates the weighting axis
  bandwidth: 0.1
  ref_percentile: 5.0
  threshold: 0.025             # same as baseline: binary penalty below this density
weight:
  type: lagrangian
  constraint: cost              # ε bounds mean cost per step — matches Lagrangian formulation.
                               # With binary threshold, cost is 0 or 1, so C is in the same
                               # range as zone step fraction.
  epsilon: 0.01               # allowed zone-violation rate, PER TRAINING STEP
                               # (sweep {0.02, 0.05}). Not a bound on the reported
                               # per-episode zone_visit_rate, which runs higher.
  eta_alpha: 10               # α must be able to reach the baseline's p~10 within
                               # the run: 150k steps / update_freq 500 = 300 dual
                               # steps, so η·Σ(C−ε) ≈ 0.1·300·0.3 ≈ 9. η=0.01 with
                               # update_freq 1000 moved α by ~1 total = fixed weight.
  alpha_init: 5.0              # start at baseline's p=10; α adapts down if constraint is met
  alpha_max: null
  update_freq: 500             # dual step every N env steps
agent:
  algo: sac
  total_steps: 150000
eval:
  episodes: 200
  max_steps: 200
  reward: clean
compute:
  local_mem_budget_mb: 18000
