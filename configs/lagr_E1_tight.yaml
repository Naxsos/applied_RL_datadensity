# Same as lagr_E1.yaml but with epsilon tightened to be a comparably hard
# constraint as baseline's toughest sweep point (p=30, ~0.45-0.59 per-episode
# zone_visit_rate). epsilon is a PER-STEP target; over a 200-step episode,
# (1-0.004)^200 ~= 0.45 chance of never entering the zone -- matches baseline's
# p=30 ballpark. Tests whether lagr can reach that same real safety level while
# still beating baseline on return, which is the actual claim worth checking.
method: lagr
env:
  id: E1
  offline_dataset: data/E1_offline.parquet
  excluded_zone: [1.2566370614359172, 1.8849555921538759]   # [2pi/5, 3pi/5], paper zone
  zone_symmetric: false        # one side only -> the agent can swing up around the OTHER
                               # side. Mirroring it (true) blocks both routes, which makes
                               # zone avoidance and swing-up mutually exclusive.
  start_state: {theta: 3.141592653589793, theta_dot: 0.0, noise: 0.05}   # spec §3: resting
                               # position. Gym's default reset is uniform over the whole
                               # circle, which makes zone_visit_rate a statement about the
                               # start state instead of about the agent's route choice.
transition_model:
  type: lstm
  frozen_checkpoint: null
  obs_dim: 3
  act_dim: 1
cost_signal:
  type: kde_density
  bandwidth: 0.1
  ref_percentile: 5.0
weight:
  type: lagrangian
  constraint: zone
  epsilon: 0.004
  eta_alpha: 0.1
  alpha_init: 1.0
  alpha_max: null
  update_freq: 500
agent:
  algo: sac
  total_steps: 80000
eval:
  episodes: 2000
  max_steps: 200
  reward: clean
compute:
  local_mem_budget_mb: 18000
