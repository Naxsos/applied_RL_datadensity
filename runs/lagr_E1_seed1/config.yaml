method: lagr
env:
  id: E1
  offline_dataset: data/E1_offline.parquet
transition_model:
  type: lstm
  frozen_checkpoint: null
  obs_dim: 3
  act_dim: 1
cost_signal:
  type: kde_density
  bandwidth: 0.1
  ref_percentile: 5.0
weight:
  type: lagrangian
  constraint: zone
  epsilon: 0.004
  eta_alpha: 1.0
  alpha_init: 1.0
  alpha_max: null
  update_freq: 500
agent:
  algo: sac
  total_steps: 150000
eval:
  episodes: 2000
  max_steps: 200
  reward: clean
compute:
  local_mem_budget_mb: 18000
seed: 1
