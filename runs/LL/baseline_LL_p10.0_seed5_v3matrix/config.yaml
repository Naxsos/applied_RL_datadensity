method: baseline
env:
  id: LL
  continuous: true
  offline_dataset: data/LL_offline.parquet
  excluded_zone: box
transition_model:
  type: lstm
  frozen_checkpoint: null
  obs_dim: 8
  act_dim: 2
cost_signal:
  type: kde_density
  bandwidth: 0.1
  ref_percentile: 5.0
  threshold: 0.025
weight:
  type: fixed
  p: 10.0
agent:
  algo: sac
  total_steps: 300000
eval:
  episodes: 200
  max_steps: 500
  reward: clean
compute:
  local_mem_budget_mb: 18000
  device: mps
run_id: baseline_LL_p10.0_seed5_v3matrix
seed: 5
