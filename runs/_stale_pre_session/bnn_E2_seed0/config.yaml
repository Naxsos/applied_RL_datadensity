method: bnn
env:
  id: E2
  offline_dataset: data/E2_offline.parquet
transition_model:
  type: bnn
  frozen_checkpoint: models/E2_bnn.pt
  mc_samples: 10
  dropout: 0.1
  obs_dim: 3
  act_dim: 1
cost_signal:
  type: bnn_uncertainty
  agg: mean
weight:
  type: fixed
  p: 0.6
agent:
  algo: sac
  total_steps: 150000
eval:
  episodes: 2000
  max_steps: 200
  reward: clean
compute:
  local_mem_budget_mb: 18000
seed: 0
