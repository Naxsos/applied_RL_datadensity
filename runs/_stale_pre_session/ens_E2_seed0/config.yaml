method: ens
env:
  id: E2
  offline_dataset: data/E2_offline.parquet
transition_model:
  type: ensemble
  frozen_checkpoint: models/E2_ensemble.pt
  n_models: 5
  obs_dim: 3
  act_dim: 1
cost_signal:
  type: ensemble_variance
  agg: mean
weight:
  type: fixed
  p: 0.6
agent:
  algo: sac
  total_steps: 150000
eval:
  episodes: 2000
  max_steps: 200
  reward: clean
compute:
  local_mem_budget_mb: 18000
seed: 0
